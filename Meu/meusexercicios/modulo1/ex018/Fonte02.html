<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fontes com Google Fonts</title>
  <style>
    @font-face {
      font-family: 'Norse';
      src: url('fonts/Norsebold.otf') format('opentype'), url('fonts/Norsebold.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }
    body {
      font-family: 'Norse', Arial, Helvetica, sans-serif;
    }

    h1 {
      font-family: 'Norse', 'Times New Roman', Times, serif;
      font-size: 2em;
      font-weight: normal;
    }
  </style>
</head>
<body>
  <h1>Título</h1>
  <p>Lorem ipsum dolor sit, amet consectetur adipisicing elit. Voluptates perferendis omnis officia esse quos minima sequi debitis vitae iusto praesentium inventore voluptatibus impedit incidunt accusamus asperiores eveniet ut, dolor necessitatibus.</p>

</body>
</html>
